<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Badminton Coverage (Dinamis)</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ddd;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        svg {
            background: white;
            touch-action: none;
            display: block;
            /* Full layar: lapangan memenuhi tinggi layar HP, rasio tetap */
            height: 100dvh;
            max-width: 100vw;
            width: auto;
        }
        .hit { fill: transparent; stroke: none; cursor: grab; } /* target sentuh besar utk jari */
        .player { cursor: grab; }
        .player:active { cursor: grabbing; }
        .court-line { stroke: #000; stroke-width: 1.5; }

        /* Tombol mode di atas layar */
        #modeBar {
            position: fixed;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 5;
        }
        #modeBar button {
            font-size: 13px;
            padding: 6px 14px;
            border: 1px solid #888;
            border-radius: 16px;
            background: rgba(255,255,255,0.9);
            cursor: pointer;
        }
        #modeBar button.active {
            background: #1a5c1a;
            color: #fff;
            border-color: #1a5c1a;
        }

        /* Panduan awal */
        #intro {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        #intro .box {
            background: #fff;
            border-radius: 12px;
            padding: 20px 18px;
            max-width: 300px;
            margin: 0 16px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        #intro .box p { margin: 0 0 14px; font-size: 15px; line-height: 1.5; }
        #intro .box button {
            font-size: 15px;
            padding: 8px 32px;
            border: none;
            border-radius: 8px;
            background: #1a5c1a;
            color: #fff;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div id="intro">
    <div class="box">
        <p>Tinggal gerak-gerakin gambar pemain sesuka hati, nanti kelihatan mana area tanggung jawab tiap pemain dan mana area <b>deadzone</b> (merah).</p>
        <button id="introOk">OK</button>
    </div>
</div>
<div id="modeBar">
    <button id="modeFree" class="active">Bebas</button>
    <button id="modeFollow">Ikuti Partner</button>
</div>
<!--
  Skala: 40 px = 1 meter. Lapangan ganda nyata 6,10 m x 13,40 m.
  Pojok kiri-atas lapangan pada piksel (44, 24); net di tengah.
  Koordinat meter: x = 0..6,10 (kiri->kanan), y = 0 (baseline dekat, bawah) .. 13,40 (baseline jauh, atas).
-->
<!-- viewBox di-crop pas ke tepi lapangan (44..288 x 24..560, +1px utk tebal garis) -->
<svg id="court" width="246" height="538" viewBox="43 23 246 538">
    <!-- Area coverage digambar sebagai sel grid (warna diredupkan) -->
    <path id="greenArea" fill="rgba(0,180,0,0.16)" stroke="none"/>
    <path id="blueArea" fill="rgba(50,100,255,0.16)" stroke="none"/>
    <path id="purpleArea" fill="rgba(140,60,200,0.16)" stroke="none"/>
    <path id="yellowArea" fill="rgba(235,190,0,0.20)" stroke="none"/>
    <path id="deadArea" fill="rgba(200,0,0,0.22)" stroke="none"/>
    <!-- Garis batas antar wilayah agar batasnya tegas -->
    <path id="boundaryLine" fill="none" stroke="#000" stroke-width="0.4" opacity="0.7"/>

    <!-- Garis lapangan (hitam, ukuran nyata dalam meter) -->
    <rect x="44" y="24" width="244" height="536" fill="none" class="court-line"/>
    <!-- Sideline tunggal (0,46 m ke dalam) -->
    <line x1="62.4" y1="24" x2="62.4" y2="560" class="court-line"/>
    <line x1="269.6" y1="24" x2="269.6" y2="560" class="court-line"/>
    <!-- Garis servis pendek (1,98 m dari net) -->
    <line x1="44" y1="212.8" x2="288" y2="212.8" class="court-line"/>
    <line x1="44" y1="371.2" x2="288" y2="371.2" class="court-line"/>
    <!-- Garis servis panjang ganda (0,76 m dari baseline) -->
    <line x1="44" y1="54.4" x2="288" y2="54.4" class="court-line"/>
    <line x1="44" y1="529.6" x2="288" y2="529.6" class="court-line"/>
    <!-- Garis tengah (dari garis servis pendek ke baseline, tiap sisi) -->
    <line x1="166" y1="24" x2="166" y2="212.8" class="court-line"/>
    <line x1="166" y1="371.2" x2="166" y2="560" class="court-line"/>
    <!-- Net (tengah, 6,70 m) -->
    <line x1="44" y1="292" x2="288" y2="292" stroke="#000" stroke-width="3"/>

    <!-- Figur pemain tampak atas: bahu (ellipse ~63 cm), kepala (~31 cm), raket di tangan kanan.
         Digambar menghadap atas; diputar sesuai arah hadap lewat transform. -->
    <g id="greenBody" class="player-body">
        <ellipse cx="0" cy="0" rx="12.6" ry="5.9" fill="green" stroke="#000" stroke-width="1.1"/>
        <line x1="11.2" y1="-1.4" x2="17.5" y2="-12.6" stroke="#333" stroke-width="1.4"/>
        <ellipse cx="19.6" cy="-17.5" rx="4.5" ry="6.7" fill="none" stroke="#333" stroke-width="1.4" transform="rotate(25 19.6 -17.5)"/>
    </g>
    <g id="blueBody" class="player-body">
        <ellipse cx="0" cy="0" rx="12.6" ry="5.9" fill="royalblue" stroke="#000" stroke-width="1.1"/>
        <line x1="11.2" y1="-1.4" x2="17.5" y2="-12.6" stroke="#333" stroke-width="1.4"/>
        <ellipse cx="19.6" cy="-17.5" rx="4.5" ry="6.7" fill="none" stroke="#333" stroke-width="1.4" transform="rotate(25 19.6 -17.5)"/>
    </g>
    <g id="purpleBody" class="player-body">
        <ellipse cx="0" cy="0" rx="12.6" ry="5.9" fill="#8e3fc9" stroke="#000" stroke-width="1.1"/>
        <line x1="11.2" y1="-1.4" x2="17.5" y2="-12.6" stroke="#333" stroke-width="1.4"/>
        <ellipse cx="19.6" cy="-17.5" rx="4.5" ry="6.7" fill="none" stroke="#333" stroke-width="1.4" transform="rotate(25 19.6 -17.5)"/>
    </g>
    <g id="yellowBody" class="player-body">
        <ellipse cx="0" cy="0" rx="12.6" ry="5.9" fill="#e6b800" stroke="#000" stroke-width="1.1"/>
        <line x1="11.2" y1="-1.4" x2="17.5" y2="-12.6" stroke="#333" stroke-width="1.4"/>
        <ellipse cx="19.6" cy="-17.5" rx="4.5" ry="6.7" fill="none" stroke="#333" stroke-width="1.4" transform="rotate(25 19.6 -17.5)"/>
    </g>
    <!-- Kepala (anchor posisi drag) -->
    <circle id="green" class="player" cx="148" cy="400" r="6.3" fill="#1a5c1a" stroke="#000" stroke-width="1.1"/>
    <circle id="blue" class="player" cx="184" cy="472" r="6.3" fill="#2a4fa8" stroke="#000" stroke-width="1.1"/>
    <circle id="purple" class="player" cx="148" cy="184" r="6.3" fill="#6b2f99" stroke="#000" stroke-width="1.1"/>
    <circle id="yellow" class="player" cx="184" cy="112" r="6.3" fill="#b38f00" stroke="#000" stroke-width="1.1"/>
    <!-- Lingkaran transparan lebih besar sebagai target sentuh di HP -->
    <circle id="greenHit" class="hit" cx="148" cy="400" r="26"/>
    <circle id="blueHit" class="hit" cx="184" cy="472" r="26"/>
    <circle id="purpleHit" class="hit" cx="148" cy="184" r="26"/>
    <circle id="yellowHit" class="hit" cx="184" cy="112" r="26"/>
</svg>

<script>
(function() {
    const svg = document.getElementById("court");
    const green = document.getElementById("green");
    const blue = document.getElementById("blue");
    const greenArea = document.getElementById("greenArea");
    const blueArea = document.getElementById("blueArea");
    const deadArea = document.getElementById("deadArea");
    const greenBody = document.getElementById("greenBody");
    const blueBody = document.getElementById("blueBody");
    const purpleBody = document.getElementById("purpleBody");
    const yellowBody = document.getElementById("yellowBody");
    const purple = document.getElementById("purple");
    const yellow = document.getElementById("yellow");
    const purpleArea = document.getElementById("purpleArea");
    const yellowArea = document.getElementById("yellowArea");

    // --- Geometri lapangan (piksel) ---
    const PPM = 40;                 // piksel per meter
    const X0 = 44, X1 = 288;        // tepi kiri/kanan lapangan
    const Y0 = 24, Y1 = 560;        // tepi atas (baseline jauh) / bawah (baseline dekat)
    const NET_Y = 292;              // net (6,70 m)

    // Dua wilayah simulasi: setengah dekat (green/blue) dan setengah jauh (purple/yellow).
    const RECT_X0 = X0, RECT_X1 = X1, RECT_Y0 = NET_Y, RECT_Y1 = Y1;
    const FAR_Y0 = Y0, FAR_Y1 = NET_Y;
    const CELL = 3; // resolusi sel grid (px). Makin kecil makin akurat batas areanya.

    // --- Model gerak manusia (satuan nyata: meter & detik) ---
    const T_REACT   = 0.18;  // waktu reaksi sebelum mulai bergerak (detik)
    const V_NOMINAL = 4.5;   // kecepatan puncak (m/detik)
    const A_NOMINAL = 12;    // percepatan (m/detik^2): tidak langsung ngebut
    const DIR_MAX_EXTRA = 3; // biaya arah maksimum di belakang penuh
    const SPEED = 1;         // kedua pemain kecepatan sama
    const FACE_DEG = 0;      // menghadap net
    const MAX_REACH_M = 4.0; // jangkauan maksimal (meter)
    const BLIND = 0.40;      // efek titik buta

    let drag = null;
    let followMode = false;

    // --- UI: panduan awal & tombol mode ---
    document.getElementById("introOk").addEventListener("click", () => {
        document.getElementById("intro").style.display = "none";
    });
    const modeFreeBtn = document.getElementById("modeFree");
    const modeFollowBtn = document.getElementById("modeFollow");
    function setMode(follow) {
        followMode = follow;
        modeFreeBtn.classList.toggle("active", !follow);
        modeFollowBtn.classList.toggle("active", follow);
    }
    modeFreeBtn.addEventListener("click", () => setMode(false));
    modeFollowBtn.addEventListener("click", () => setMode(true));

    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
    function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

    function mousePos(evt) {
        const pt = svg.createSVGPoint();
        pt.x = evt.clientX;
        pt.y = evt.clientY;
        return pt.matrixTransform(svg.getScreenCTM().inverse());
    }

    // 0 derajat = menghadap net (arah -Y). Positif = putar searah jarum jam.
    function faceVector(deg) {
        const rad = deg * Math.PI / 180;
        return { x: Math.sin(rad), y: -Math.cos(rad) };
    }

    // Biaya arah (faktor >= 1): gerak ke depan/samping murah, ke belakang mahal.
    function dirCost(px, py, cx, cy, faceDeg, blindStrength) {
        const vx = px - cx, vy = py - cy;
        const vLen = Math.hypot(vx, vy);
        if (vLen < 1e-6) return 1;
        const f = faceVector(faceDeg);
        const cosA = clamp((vx * f.x + vy * f.y) / vLen, -1, 1);
        const angleDeg = Math.acos(cosA) * 180 / Math.PI;
        const t = Math.pow(angleDeg / 180, 1.5);
        return 1 + blindStrength * DIR_MAX_EXTRA * t;
    }

    // Waktu tempuh menempuh jarak s (meter): percepatan a lalu kecepatan puncak v.
    function travelTime(s, v, a) {
        const sAcc = (v * v) / (2 * a);
        if (s <= sAcc) return Math.sqrt(2 * s / a);
        return v / a + (s - sAcc) / v;
    }

    // Waktu tiba total pemain ke sebuah titik = reaksi + tempuh(jarak efektif berarah, meter).
    function arrivalTime(px, py, cx, cy, speed, faceDeg, blindStrength) {
        const dMeter = Math.hypot(px - cx, py - cy) / PPM;
        const dEff = dMeter * dirCost(px, py, cx, cy, faceDeg, blindStrength);
        const v = V_NOMINAL * speed, a = A_NOMINAL * speed;
        return T_REACT + travelTime(dEff, v, a);
    }

    // Posisikan figur badan (bahu+raket) di posisi pemain, diputar sesuai arah hadap.
    function updateBody(bodyEl, cx, cy, faceDeg) {
        bodyEl.setAttribute("transform", `translate(${cx},${cy}) rotate(${faceDeg})`);
    }

    // Klasifikasi satu setengah lapangan untuk sepasang pemain (A, B).
    // faceDeg: arah hadap net pasangan itu (0 = tim bawah, 180 = tim atas).
    // Mengembalikan path area A, area B, dead zone, dan garis batas.
    function classifyHalf(ax, ay, bx, by, faceDeg, y0Half, y1Half, timeBudget) {
        let aPath = "", bPath = "", deadPath = "";
        const nCols = Math.ceil((RECT_X1 - RECT_X0) / CELL);
        const nRows = Math.ceil((y1Half - y0Half) / CELL);
        const cls = new Uint8Array(nCols * nRows);

        for (let r = 0; r < nRows; r++) {
            const y = y0Half + r * CELL;
            const yMid = y + CELL / 2;
            const y1 = Math.min(y + CELL, y1Half);
            for (let c = 0; c < nCols; c++) {
                const x = RECT_X0 + c * CELL;
                const xMid = x + CELL / 2;
                const x1 = Math.min(x + CELL, RECT_X1);

                const tA = arrivalTime(xMid, yMid, ax, ay, SPEED, faceDeg, BLIND);
                const tB = arrivalTime(xMid, yMid, bx, by, SPEED, faceDeg, BLIND);
                const reachA = tA <= timeBudget;
                const reachB = tB <= timeBudget;

                const seg = `M${x},${y} L${x1},${y} L${x1},${y1} L${x},${y1} Z `;

                let k;
                if (!reachA && !reachB) { k = 2; deadPath += seg; }
                else if (reachA && !reachB) { k = 0; aPath += seg; }
                else if (reachB && !reachA) { k = 1; bPath += seg; }
                else if (tA <= tB) { k = 0; aPath += seg; }
                else { k = 1; bPath += seg; }
                cls[r * nCols + c] = k;
            }
        }

        let boundary = "";
        for (let r = 0; r < nRows; r++) {
            for (let c = 0; c < nCols; c++) {
                const k = cls[r * nCols + c];
                const x = RECT_X0 + c * CELL, y = y0Half + r * CELL;
                if (c + 1 < nCols && cls[r * nCols + c + 1] !== k) {
                    const xe = Math.min(x + CELL, RECT_X1);
                    boundary += `M${xe},${y} L${xe},${Math.min(y + CELL, y1Half)} `;
                }
                if (r + 1 < nRows && cls[(r + 1) * nCols + c] !== k) {
                    const ye = Math.min(y + CELL, y1Half);
                    boundary += `M${x},${ye} L${Math.min(x + CELL, RECT_X1)},${ye} `;
                }
            }
        }
        return { aPath, bPath, deadPath, boundary };
    }

    function drawAndEnforce() {
        const gx = +green.getAttribute("cx"), gy = +green.getAttribute("cy");
        const bx = +blue.getAttribute("cx"), by = +blue.getAttribute("cy");
        const px_ = +purple.getAttribute("cx"), py_ = +purple.getAttribute("cy");
        const yx = +yellow.getAttribute("cx"), yy = +yellow.getAttribute("cy");

        // Anggaran waktu: waktu tiba ideal (arah depan) menempuh "Jangkauan Maksimal".
        const timeBudget = T_REACT + travelTime(MAX_REACH_M, V_NOMINAL, A_NOMINAL);

        // Setengah bawah: green/blue (hadap net = 0°). Setengah atas: purple/yellow (180°).
        const near = classifyHalf(gx, gy, bx, by, FACE_DEG, RECT_Y0, RECT_Y1, timeBudget);
        const far  = classifyHalf(px_, py_, yx, yy, FACE_DEG + 180, FAR_Y0, FAR_Y1, timeBudget);

        greenArea.setAttribute("d", near.aPath);
        blueArea.setAttribute("d", near.bPath);
        purpleArea.setAttribute("d", far.aPath);
        yellowArea.setAttribute("d", far.bPath);
        deadArea.setAttribute("d", near.deadPath + far.deadPath);
        document.getElementById("boundaryLine").setAttribute("d", near.boundary + far.boundary);

        updateBody(greenBody, gx, gy, FACE_DEG);
        updateBody(blueBody, bx, by, FACE_DEG);
        updateBody(purpleBody, px_, py_, FACE_DEG + 180);
        updateBody(yellowBody, yx, yy, FACE_DEG + 180);

        // Lingkaran hit mengikuti posisi pemain.
        greenHit.setAttribute("cx", gx); greenHit.setAttribute("cy", gy);
        blueHit.setAttribute("cx", bx); blueHit.setAttribute("cy", by);
        purpleHit.setAttribute("cx", px_); purpleHit.setAttribute("cy", py_);
        yellowHit.setAttribute("cx", yx); yellowHit.setAttribute("cy", yy);
    }

    // Drag lewat lingkaran hit yang lebih besar (ramah jari di HP).
    const greenHit = document.getElementById("greenHit");
    const blueHit = document.getElementById("blueHit");
    const purpleHit = document.getElementById("purpleHit");
    const yellowHit = document.getElementById("yellowHit");
    const hitPairs = [[greenHit, green], [blueHit, blue], [purpleHit, purple], [yellowHit, yellow]];

    // Pasangan setim (untuk jarak minimum) dan batas setengah lapangan tiap pemain.
    function teammateOf(p) {
        if (p === green) return blue;
        if (p === blue) return green;
        if (p === purple) return yellow;
        return purple;
    }
    function halfBoundsOf(p) {
        return (p === green || p === blue)
            ? { y0: RECT_Y0 + 5, y1: RECT_Y1 - 8 }
            : { y0: FAR_Y0 + 8, y1: FAR_Y1 - 5 };
    }
    hitPairs.forEach(([hit, p]) => {
        hit.addEventListener("pointerdown", e => {
            drag = p;
            hit.setPointerCapture(e.pointerId);
            e.preventDefault();
        });
        hit.addEventListener("pointerup", () => { drag = null; });
        hit.addEventListener("pointercancel", () => { drag = null; });
    });
    window.addEventListener("pointerup", () => { drag = null; });

    // --- Mode "Ikuti Partner": cari posisi partner yang meminimalkan deadzone ---
    // Grid kasar agar tetap ringan di HP: kandidat posisi & sel evaluasi.
    const FOLLOW_CAND_STEP = 14; // jarak antar kandidat posisi partner (px)
    const FOLLOW_EVAL_CELL = 12; // ukuran sel evaluasi deadzone (px)

    function halfOf(p) {
        return (p === green || p === blue)
            ? { y0: RECT_Y0, y1: RECT_Y1, face: FACE_DEG }
            : { y0: FAR_Y0, y1: FAR_Y1, face: FACE_DEG + 180 };
    }

    // Posisi partner terbaik: deadzone minimum; seri -> paling dekat posisi partner sekarang.
    function bestPartnerPos(fixedX, fixedY, partner) {
        const h = halfOf(partner);
        const hb = halfBoundsOf(partner);
        const timeBudget = T_REACT + travelTime(MAX_REACH_M, V_NOMINAL, A_NOMINAL);
        const curX = +partner.getAttribute("cx"), curY = +partner.getAttribute("cy");

        // Precompute: sel yang TIDAK terjangkau pemain yang dipegang.
        const cells = [];
        for (let y = h.y0 + FOLLOW_EVAL_CELL / 2; y < h.y1; y += FOLLOW_EVAL_CELL) {
            for (let x = RECT_X0 + FOLLOW_EVAL_CELL / 2; x < RECT_X1; x += FOLLOW_EVAL_CELL) {
                if (arrivalTime(x, y, fixedX, fixedY, SPEED, h.face, BLIND) > timeBudget)
                    cells.push(x, y);
            }
        }

        let best = { x: curX, y: curY }, bestDead = Infinity, bestMove = Infinity;
        for (let cy = hb.y0; cy <= hb.y1; cy += FOLLOW_CAND_STEP) {
            for (let cx = RECT_X0; cx <= RECT_X1; cx += FOLLOW_CAND_STEP) {
                if (Math.hypot(cx - fixedX, cy - fixedY) < 24) continue;
                let dead = 0;
                for (let i = 0; i < cells.length; i += 2) {
                    if (arrivalTime(cells[i], cells[i + 1], cx, cy, SPEED, h.face, BLIND) > timeBudget)
                        dead++;
                }
                const move = Math.hypot(cx - curX, cy - curY);
                if (dead < bestDead || (dead === bestDead && move < bestMove)) {
                    bestDead = dead; bestMove = move; best = { x: cx, y: cy };
                }
            }
        }
        return best;
    }

    // Animasi partner bergeser halus ke target.
    let followTarget = null, followEl = null, followRaf = null;
    function stepFollow() {
        followRaf = null;
        if (!followTarget || !followEl) return;
        if (drag === followEl) { followTarget = null; return; } // pemain diambil alih user
        const cx = +followEl.getAttribute("cx"), cy = +followEl.getAttribute("cy");
        const dx = followTarget.x - cx, dy = followTarget.y - cy;
        const d = Math.hypot(dx, dy);
        if (d < 0.5) {
            followEl.setAttribute("cx", followTarget.x);
            followEl.setAttribute("cy", followTarget.y);
            drawAndEnforce();
            followTarget = null;
            return;
        }
        followEl.setAttribute("cx", cx + dx * 0.22);
        followEl.setAttribute("cy", cy + dy * 0.22);
        drawAndEnforce();
        followRaf = requestAnimationFrame(stepFollow);
    }
    function setFollowTarget(el, pos) {
        followEl = el;
        followTarget = pos;
        if (followRaf === null) followRaf = requestAnimationFrame(stepFollow);
    }

    // Drag dihaluskan: posisi pointer terakhir disimpan, perhitungan berat
    // (klasifikasi seluruh grid) hanya dijalankan sekali per frame (rAF).
    let pendingEvt = null;
    let rafId = null;

    function processMove() {
        rafId = null;
        if (!drag || !pendingEvt) return;
        const p = mousePos(pendingEvt);
        pendingEvt = null;
        const hb = halfBoundsOf(drag);
        let cx = clamp(p.x, RECT_X0, RECT_X1);
        let cy = clamp(p.y, hb.y0, hb.y1);
        const other = teammateOf(drag);
        const otherPos = { x: +other.getAttribute("cx"), y: +other.getAttribute("cy") };

        let newPos = { x: cx, y: cy };
        const minDist = 24;
        const d = dist(newPos, otherPos);
        if (d < minDist && d > 0.001) {
            const ratio = (minDist - d) / d;
            newPos.x += (newPos.x - otherPos.x) * ratio;
            newPos.y += (newPos.y - otherPos.y) * ratio;
            newPos.x = clamp(newPos.x, RECT_X0, RECT_X1);
            newPos.y = clamp(newPos.y, hb.y0, hb.y1);
        }

        drag.setAttribute("cx", newPos.x);
        drag.setAttribute("cy", newPos.y);

        // Mode "Ikuti Partner": partner otomatis menutup deadzone.
        if (followMode) {
            const partner = teammateOf(drag);
            setFollowTarget(partner, bestPartnerPos(newPos.x, newPos.y, partner));
        }
        drawAndEnforce();
    }

    window.addEventListener("pointermove", e => {
        if (!drag) return;
        pendingEvt = e;
        if (rafId === null) rafId = requestAnimationFrame(processMove);
    });

    drawAndEnforce();
})();
</script>
</body>
</html>
